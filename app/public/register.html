<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create an account · Toolshop</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="site-header"><a class="brand" href="/">Toolshop</a></header>
  <main class="auth">
    <h1>Create your account</h1>
    <form data-test="register-form" novalidate>
      <label for="name">Full name</label>
      <input id="name" name="name" autocomplete="name" data-test="name">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="email" data-test="email">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" aria-describedby="pw-hint" data-test="password">
      <p class="hint" id="pw-hint">At least 8 characters</p>
      <p class="error" role="alert" data-test="register-error" hidden></p>
      <button class="primary" type="submit" data-test="register-submit">Create account</button>
    </form>
    <p>Already have an account? <a href="/login">Sign in</a></p>
  </main>
  <script src="/app.js"></script>
  <script>
    const form = document.querySelector('form');
    const error = document.querySelector('[data-test="register-error"]');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      error.hidden = true;
      const body = { name: form.elements.name.value, email: form.elements.email.value.trim(), password: form.elements.password.value };
      const created = await api('/api/users', { method: 'POST', body });
      if (!created.ok) return showMessage(error, created.data.error);
      await api('/api/login', { method: 'POST', body: { email: body.email, password: body.password } });
      location.assign('/?welcome=1');
    });
  </script>
</body>
</html>
